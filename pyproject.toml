[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amogmm"
version = "1.0.0"
description = "Neural network classifiers trained as amortized Gaussian mixture models"
authors = [{ name = "Leonhard Kohl-Lörting" }]
license = { text = "AFL-3.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "emmi @ git+https://github.com/variational-sublinear-clustering/emmi@c804b55388f590befd970f657941c5f75b757eec",
]

[tool.setuptools]
packages = ["amogmm"]
